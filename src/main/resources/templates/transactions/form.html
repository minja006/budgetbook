<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Buchung</title>
</head>
<body>

<h1>Buchung erfassen</h1>

<form th:action="${transaction.id} != null ? @{/transactions/{id}(id=${transaction.id})} : @{/transactions}"
      th:object="${transaction}" method="post">

    <label>Betrag:</label>
    <input type="number" step="0.01" th:field="*{amount}" />
    <span th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}" style="color:red"></span>
    <br>

    <label>Datum:</label>
    <input type="date" th:field="*{bookingDate}" />
    <span th:if="${#fields.hasErrors('bookingDate')}" th:errors="*{bookingDate}" style="color:red"></span>
    <br>

    <label>Typ:</label>
    <select th:field="*{type}">
        <option value="INCOME">Einnahme</option>
        <option value="EXPENSE">Ausgabe</option>
    </select>
    <br>

    <label>Kategorie:</label>
    <select th:field="*{category}">
        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
    </select>
    <br>

    <label>Beschreibung:</label>
    <input type="text" th:field="*{description}" />
    <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color:red"></span>
    <br>

    <button type="submit">Speichern</button>
</form>

<a href="/transactions">Zurück</a>

</body>
</html>
