<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Löschen bestätigen</title>
</head>
<body>

<h1>Buchung wirklich löschen?</h1>

<p th:text="${transaction.description}"></p>
<p th:text="${transaction.amount}"></p>

<form th:action="@{/transactions/{id}/delete(id=${transaction.id})}" method="post">
  <button type="submit">Ja, löschen</button>
</form>
<a href="/transactions">Abbrechen</a>

</body>
</html>
